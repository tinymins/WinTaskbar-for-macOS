name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: 0.0.1
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-26
          - architecture: x86_64
            runner: macos-26-intel
          - architecture: universal
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-PRERELEASE format." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        run: bash Scripts/package_release.sh "$VERSION" "${{ matrix.architecture }}" "$GITHUB_RUN_NUMBER"

      - name: Inspect package
        shell: bash
        run: |
          lipo -archs "dist/releases/${{ matrix.architecture }}/WinTaskbar.app/Contents/MacOS/WinTaskbar"
          plutil -p "dist/releases/${{ matrix.architecture }}/WinTaskbar.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "dist/releases/${{ matrix.architecture }}/WinTaskbar.app"
          "dist/releases/${{ matrix.architecture }}/WinTaskbar.app/Contents/MacOS/WinTaskbar" --self-test

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.architecture }}
          path: |
            dist/releases/WinTaskbar-*-macos-${{ matrix.architecture }}.zip
            dist/releases/WinTaskbar-*-macos-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WinTaskbar $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
